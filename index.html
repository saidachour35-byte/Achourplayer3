    <style>
      html:not(.native-player-active),
      html:not(.native-player-active) body,
      html:not(.native-player-active) #root {
        background-color: #020205 !important;
        color: #ffffff !important;
      }
      html, body, #root {
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      .pre-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020205;
        overflow: hidden;
        font-family: "Montserrat", "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      @keyframes preSplashPulse {
        0%, 100% { transform: scale3d(0.95, 0.95, 1); opacity: 0.45; }
        50% { transform: scale3d(1.08, 1.08, 1); opacity: 0.72; }
      }
      @keyframes preSplashSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .pre-splash-glow {
        position: absolute;
        width: 760px;
        height: 760px;
        border-radius: 9999px;
        pointer-events: none;
        opacity: 0.55;
        background: radial-gradient(circle at center, rgba(255,215,0,0.34) 0%, rgba(124,77,255,0.22) 38%, rgba(255,75,75,0.12) 58%, transparent 74%);
        animation: preSplashPulse 6s ease-in-out infinite;
        will-change: transform, opacity;
      }
      .pre-splash-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        max-width: 90vw;
        padding: 0 12px;
      }
      .pre-splash-logo-frame {
        margin-bottom: 12px;
        border-radius: 20px;
        padding: 2px;
        background: linear-gradient(135deg, rgba(251,191,36,0.5), rgba(147,51,234,0.4), rgba(59,130,246,0.5));
        box-shadow: 0 15px 40px rgba(0,0,0,0.85);
      }
      .pre-splash-logo-inner {
        width: 96px;
        height: 96px;
        border-radius: 18px;
        overflow: hidden;
        background: #0b0d14;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pre-splash-logo-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pre-splash-title {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 16px;
        font-size: 18px;
        line-height: 28px;
        font-weight: 700;
        letter-spacing: 0.025em;
      }
      .pre-splash-title span {
        margin: 0 1px;
        display: inline-block;
      }
      .pre-splash-title .sp {
        width: 8px;
      }
      .pre-splash-ring {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pre-splash-ring svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: preSplashSpin 14s linear infinite;
        will-change: transform;
      }
      .pre-splash-count {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .pre-splash-num {
        font-family: "Montserrat", "Noto Sans Arabic", system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
        color: #ff6e40;
        text-shadow: 0 0 12px rgba(255,110,64,0.8);
      }
      .pre-splash-sec {
        font-size: 7px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.6);
        font-weight: 700;
      }
      @media (min-width: 640px) {
        .pre-splash-logo-frame { margin-bottom: 16px; border-radius: 24px; padding: 4px; }
        .pre-splash-logo-inner { width: 112px; height: 112px; border-radius: 22px; }
        .pre-splash-title { margin-bottom: 20px; font-size: 24px; line-height: 32px; letter-spacing: 0.05em; }
        .pre-splash-title span { margin: 0 4px; }
        .pre-splash-title .sp { width: 12px; }
        .pre-splash-ring { width: 80px; height: 80px; }
        .pre-splash-num { font-size: 24px; line-height: 32px; }
        .pre-splash-sec { font-size: 8px; }
      }
      @media (min-width: 768px) {
        .pre-splash-logo-inner { width: 144px; height: 144px; }
        .pre-splash-title { font-size: 30px; line-height: 36px; }
      }
    </style>
